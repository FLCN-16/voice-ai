[project]
name = "voice-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rishabh Kumar", email = "rishabh.kumar@verticurl.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.1.0",
    "langgraph>=1.2.17",
    "pymongo>=4.15.0",
    "python-dotenv>=1.2.0",
    "websockets>=15.0",
]

[project.scripts]
voice-ai = "app:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
